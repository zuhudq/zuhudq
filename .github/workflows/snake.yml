name: Generate Snake Animation

on:
  # Jalankan otomatis setiap 12 jam
  schedule:
    - cron: "0 */12 * * *"
  
  # Memungkinkan kamu menjalankan script ini secara manual
  workflow_dispatch:
  
  # Jalankan script setiap kali ada push ke branch main
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Action untuk meng-generate animasi ular
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          # Username GitHub kamu
          github_user_name: zuhudq
          
          # Output file yang akan dihasilkan (versi light dan dark mode)
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push file SVG yang sudah di-generate ke branch 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
